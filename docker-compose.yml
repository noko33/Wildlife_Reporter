services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wildlife}
      MYSQL_USER: ${MYSQL_USER:-wildlife}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wildlife_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wildlife-reporter-app:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-wildlife}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: ${MYSQL_USER:-wildlife}
      DB_PASSWORD: ${MYSQL_PASSWORD:-wildlife_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-docker-jwt-secret-before-production-123456789}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql_data:
