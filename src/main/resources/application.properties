spring.application.name=team15 Backend Service

#MySQL Integration
spring.datasource.url=jdbc:mysql://localhost:3306/test?useSSL=false&serverTimezone=UTC
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT authentication. Set JWT_SECRET to a random value of at least 32 bytes in production.
app.security.jwt.secret=${JWT_SECRET:change-this-development-jwt-secret-before-production-123456789}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# OpenAPI and Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
